          maxLength: 60
        base_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Ex-showroom price (₹)
        original_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          title: Strikethrough original price (₹)
          description: For promotional strikethrough display (e.g., ₹104,999/-*)
