          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - primary_colour
      - primary_colour_details
      - secondary_colour
      - secondary_colour_details
    ColourCombinationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          title: Combination name
          maxLength: 120
        is_dual_tone:
