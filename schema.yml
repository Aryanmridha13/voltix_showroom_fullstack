      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleColourConfigAdminList'
          description: ''
    post:
      operationId: customizer_configs_create
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleColourConfigAdmin'
          description: ''
  /api/v1/customizer/configs/{id}/:
    get:
      operationId: customizer_configs_retrieve
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Vehicle Colour Configuration.
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleColourConfigAdmin'
          description: ''
    put:
      operationId: customizer_configs_update
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Vehicle Colour Configuration.
        required: true
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleColourConfigAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleColourConfigAdmin'
          description: ''
    patch:
      operationId: customizer_configs_partial_update
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Vehicle Colour Configuration.
        required: true
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVehicleColourConfigAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVehicleColourConfigAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVehicleColourConfigAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleColourConfigAdmin'
          description: ''
    delete:
      operationId: customizer_configs_destroy
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Vehicle Colour Configuration.
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/customizer/variants/{variant_id}/options/:
    get:
      operationId: customizer_variants_options_retrieve
      description: Returns available single-tone & dual-tone finishes with price adjustments
        and high-res images for a vehicle variant.
      summary: Get Vehicle Customizer Options
      parameters:
      - in: path
        name: variant_id
        schema:
          type: integer
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Customization options loaded
