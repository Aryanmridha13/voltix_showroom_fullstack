        schema:
          type: string
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedColourCombinationList'
          description: ''
    post:
      operationId: customizer_combinations_create
      summary: Create Colour Combination (Admin Only)
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColourCombination'
          description: ''
  /api/v1/customizer/combinations/{id}/:
