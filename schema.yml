      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColourCombination'
          description: ''
    put:
      operationId: customizer_combinations_update
      summary: Update Colour Combination (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour Combination.
        required: true
      tags:
