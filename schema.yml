openapi: 3.0.3
info:
  title: Voltix EV Motors Showroom API
  version: 1.0.0
  description: Enterprise RESTful API specification for the Voltix EV Motors management
    platform. Includes vehicle catalogue, dynamic colour customizer, spare parts inventory,
    test ride booking engine, and customer ratings & feedback.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Allows authenticated users to change their account password.
      summary: Change Password
      tags:
      - Authentication & Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates via email/username and password. Returns JWT tokens
        and user profile.
      summary: Customer / Admin Login
      tags:
      - Authentication & Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Stateless JWT Logout endpoint.
        Instructs the frontend to purge stored tokens.
      summary: Logout User
      tags:
      - Authentication & Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully. Purge client tokens.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve or update currently logged in user profile.
      summary: Get Current User Profile
      tags:
      - Authentication & Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: Retrieve or update currently logged in user profile.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Retrieve or update currently logged in user profile.
      summary: Update Current User Profile
      tags:
      - Authentication & Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates a new customer account with profile details and issues
        JWT tokens.
      summary: Register Customer Account
      tags:
      - Authentication & Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Provides a new access token using a valid refresh token.
      summary: Refresh Access Token
      tags:
      - Authentication & Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Token invalid or expired
  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        Test Ride Booking ViewSet managing scheduling, slot validation,
        customer booking history, cancellation, and admin status updates.
      summary: List Test Ride Bookings (Customer sees own, Admin sees all)
      parameters:
      - in: query
        name: booking_date
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Booking status
          enum:
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - PENDING
        description: |-
          * `PENDING` - Pending Confirmation
          * `CONFIRMED` - Confirmed
          * `COMPLETED` - Completed
          * `CANCELLED` - Cancelled
      - in: query
        name: variant
        schema:
          type: integer
      tags:
      - Test Ride Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingDetailList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        Test Ride Booking ViewSet managing scheduling, slot validation,
        customer booking history, cancellation, and admin status updates.
      summary: Book a Test Ride (Authenticated Customer)
      tags:
      - Test Ride Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      description: |-
        Test Ride Booking ViewSet managing scheduling, slot validation,
        customer booking history, cancellation, and admin status updates.
      summary: Get Single Booking Details (Owner or Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Test Ride Booking.
        required: true
      tags:
      - Test Ride Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    patch:
      operationId: bookings_cancel_partial_update
      description: Allows the customer or an admin to cancel an eligible test ride
        booking.
      summary: Cancel an Active Booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Test Ride Booking.
        required: true
      tags:
      - Test Ride Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookingCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookingCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookingCancelRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Booking cancelled successfully
  /api/v1/bookings/{id}/update-status/:
    patch:
      operationId: bookings_update_status_partial_update
      description: Allows administrators to confirm or mark test rides as completed.
      summary: Update Booking Status (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Test Ride Booking.
        required: true
      tags:
      - Test Ride Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingStatusUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminBookingStatusUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Booking status updated
  /api/v1/bookings/available-slots/:
    get:
      operationId: bookings_available_slots_retrieve
      description: Returns list of time slots for a vehicle on a specific date, marking
        available vs booked.
      summary: Check Slot Availability for Vehicle & Date
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Date in YYYY-MM-DD format
        required: true
      - in: query
        name: variant_id
        schema:
          type: integer
        description: Vehicle Variant ID
        required: true
      tags:
      - Test Ride Bookings
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Slot availability retrieved
  /api/v1/customizer/calculate-price/:
    post:
      operationId: customizer_calculate_price_create
      description: Validates variant and colour combination, calculates price adjustments,
        and returns authoritative total price and image.
      summary: Calculate Dynamic Configuration Price
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceCalculationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceCalculationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceCalculationRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Price calculated successfully
        '400':
          description: Incompatible or unavailable combination
  /api/v1/customizer/colours/:
    get:
      operationId: customizer_colours_list
      summary: List Vehicle Colours (Public)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedColourList'
          description: ''
    post:
      operationId: customizer_colours_create
      summary: Create Colour (Admin Only)
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColourRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColourRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColourRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colour'
          description: ''
  /api/v1/customizer/colours/{id}/:
    get:
      operationId: customizer_colours_retrieve
      summary: Get Colour Details (Public)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour.
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colour'
          description: ''
    put:
      operationId: customizer_colours_update
      summary: Update Colour (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour.
        required: true
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColourRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColourRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColourRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colour'
          description: ''
    patch:
      operationId: customizer_colours_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour.
        required: true
      tags:
      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedColourRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedColourRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedColourRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colour'
          description: ''
    delete:
      operationId: customizer_colours_destroy
      summary: Delete Colour (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour.
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/customizer/combinations/:
    get:
      operationId: customizer_combinations_list
      summary: List Colour Combinations (Public)
      parameters:
      - name: ordering
        required: false
