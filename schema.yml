      - Customizer & Colours
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedColourCombinationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedColourCombinationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedColourCombinationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColourCombination'
          description: ''
    delete:
      operationId: customizer_combinations_destroy
      summary: Delete Colour Combination (Admin Only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour Combination.
        required: true
      tags:
      - Customizer & Colours
      security:
      - jwtAuth: []
      responses:
        '204':
