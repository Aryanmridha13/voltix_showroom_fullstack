      type: object
      description: |-
        Admin serializer that atomically provisions or updates a VehicleVariant
        and its nested VehicleSpecification in a single database transaction.
      properties:
        id:
          type: integer
          readOnly: true
        model:
          type: integer
          title: Vehicle model
