components:
  schemas:
    ActionEnum:
      enum:
      - ADD
      - DEDUCT
      - SET
      type: string
      description: |-
        * `ADD` - Add to current stock
        * `DEDUCT` - Deduct from current stock
        * `SET` - Set exact stock quantity
    BookingCreate:
      type: object
      properties:
        booking_date:
          type: string
          format: date
        time_slot:
          $ref: '#/components/schemas/TimeSlotEnum'
        contact_phone:
          type: string
          title: Contact phone number
          maxLength: 15
        driving_license_number:
          type: string
          maxLength: 50
      required:
      - booking_date
      - contact_phone
      - driving_license_number
      - time_slot
    BookingCreateRequest:
      type: object
      properties:
        variant_id:
          type: integer
          writeOnly: true
        booking_date:
          type: string
          format: date
        time_slot:
          $ref: '#/components/schemas/TimeSlotEnum'
        contact_phone:
          type: string
          minLength: 1
          title: Contact phone number
          maxLength: 15
        driving_license_number:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - booking_date
      - contact_phone
      - driving_license_number
      - time_slot
      - variant_id
    BookingDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
          title: Booking reference code
        customer_email:
          type: string
          format: email
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        variant:
          type: integer
          readOnly: true
          title: Vehicle variant
        variant_name:
          type: string
          readOnly: true
        model_name:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        variant_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        booking_date:
          type: string
          format: date
          readOnly: true
        time_slot:
          allOf:
          - $ref: '#/components/schemas/TimeSlotEnum'
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
          title: Contact phone number
        driving_license_number:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
          title: Booking status
        cancellation_reason:
          type: string
          readOnly: true
        admin_notes:
          type: string
          readOnly: true
          title: Internal admin notes
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_notes
      - booking_date
      - booking_reference
      - cancellation_reason
      - category_name
      - contact_phone
      - created_at
      - customer_email
      - customer_name
      - driving_license_number
      - id
      - model_name
      - status
      - time_slot
      - updated_at
      - variant
      - variant_image
      - variant_name
    BookingStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending Confirmation
        * `CONFIRMED` - Confirmed
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    Colour:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Colour name
          maxLength: 60
        hex_code:
          type: string
          title: HEX color code
          description: 'e.g., #E62E2D or #1E88E5'
          maxLength: 7
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - hex_code
      - id
      - name
    ColourCombination:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Combination name
          maxLength: 120
        is_dual_tone:
          type: boolean
          title: Is dual-tone finish
        primary_colour:
          type: integer
        primary_colour_details:
          allOf:
          - $ref: '#/components/schemas/Colour'
          readOnly: true
        secondary_colour:
          type: integer
          nullable: true
          title: Secondary colour (for dual-tone)
        secondary_colour_details:
