tags:
- name: Authentication & Profile
  description: JWT authentication, customer registration, login, and user profile
    management.
- name: Vehicles & Specifications
  description: Electric vehicle categories, models, variants, specifications, and
    catalogue imagery.
- name: Customizer & Colours
  description: Single/dual-tone colour configurations, pricing delta calculators,
    and customization preview.
- name: Spare Parts & Inventory
  description: Component categories, spare parts stock status, inventory management,
    and low-stock alerts.
- name: Test Ride Bookings
  description: Test ride scheduling, slot availability queries, concurrency lock,
    and lifecycle management.
- name: Customer Reviews & Feedback
  description: Star ratings (1-5), verified rider badges, moderation actions, and
    statistical metrics.
- name: System Health
  description: Service readiness, database latency probes, and operational diagnostics.
