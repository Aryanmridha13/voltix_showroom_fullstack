      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColourCombinationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColourCombination'
          description: ''
    patch:
      operationId: customizer_combinations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Colour Combination.
        required: true
