  /api/v1/customizer/configs/:
    get:
      operationId: customizer_configs_list
      description: Admin ViewSet for configuring vehicle colour options, images, and
        price adjustments.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
