<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="voltix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120c" />
      <stop offset="100%" stop-color="#020503" />
    </linearGradient>
    <linearGradient id="voltix-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="voltix-bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="voltix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#voltix-bg)" stroke="url(#voltix-border)" stroke-width="2.5" />

  <!-- Inner Ambient Electric Aura -->
  <circle cx="32" cy="32" r="20" fill="#10b981" fill-opacity="0.14" filter="url(#voltix-glow)" />

  <!-- Voltix Aero Chevrons (V-frame) -->
  <path d="M13 18 L23 37 L27 37 L18 18 Z" fill="#00ff88" fill-opacity="0.3" />
  <path d="M51 18 L41 37 L37 37 L46 18 Z" fill="#06b6d4" fill-opacity="0.3" />

  <!-- Voltix Central High-Voltage Zap Bolt -->
  <path d="M36 10 L18 33 H30 L26 54 L46 27 H33 L36 10 Z" fill="url(#voltix-bolt)" filter="url(#voltix-glow)" />
</svg>